# Secrets this repo documents or consumes for WS-4.1 rollout, by stable BWS UUID.
consumption = "environment-injection"

[[secret]]
uuid = "d2a4c0fc-128b-4bf5-8e25-b481010e1be0"
name = "orchestrator-factory-runner-github-M2M_TOKEN"
project = "Ops / Platform"

# The fine-grained PAT the reusable workflow checks out and pushes with
# (factory-runner.yml:53,120). It lives as a GitHub Actions repository secret named
# FACTORY_PR_TOKEN in every repo the factory targets — this manifest entry is the
# rotation trail those write-only secrets cannot provide.
#
# .cred-consumers.toml is the per-copy consumer list; read the count there, not here
# (this comment said four, then seven, then eight, and drifted each time). Since
# 2026-10-19 the SDS rotation executor re-sets every copy through its rotation App and
# verifies each by that repository's secret-fingerprint.yml report (orchestrator
# ADR-0055 increment 7).
#
# REPOSITORY ACCESS is a SECOND list and it is not derivable from the first. This is
# a fine-grained PAT, so it reaches only the repositories named when it was issued.
# Setting the Actions secret in a new target copies a token that may have no access
# to that target: onboarding project-standards on 2026-08-07 had caller, secrets and
# orchestrator allowlist all correct, and the probe run died in 35 seconds at
# actions/checkout with a 403, never reaching the claim call. Extending the list is a
# settings-page operation on the owning account; no API does it. Probe a new target
# with a throwaway workflow_dispatch before believing it works.
#
# SCOPE: a push touching .github/workflows/** requires Workflows: Read-and-write
# (fine-grained) or the `workflow` scope (classic). Without it the push is rejected
# at finalize — after coding and verification have already succeeded — which cost two
# pilot work units on 2026-08-03. The settings page is the only scope check, since
# fine-grained PATs report no x-oauth-scopes header, so a person minting a new PAT copies
# the current one's permissions there.
[[secret]]
uuid = "a3240c2e-92d7-4b32-a726-b49b0135565a"
name = "FACTORY_PR_TOKEN"
project = "SDS Operator"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-runner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "typer>=0.27.1",
]

[project.scripts]
factory-runner = "factory_runner.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pyyaml>=6.0",
  "ruff==0.16.3",
  "pyright==1.1.411",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# ruff 0.16 formats Python code blocks inside Markdown; 0.15 did not. The affected
# files here are ADRs and historical plan documents — the record, not code — so the
# formatter is excluded from them rather than allowed to rewrite them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "C90"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]

# .cred-consumers.toml — WS-0.7 rotation-lane consumer inventory for FACTORY_PR_TOKEN,
# the fine-grained PAT the reusable workflow checks out and pushes with. This repo's
# .bws-secrets.toml already owns its BWS record.
#
# Read by infraops-mcp-server's nightly security-drift run (src/security-drift/
# cred-rotation.ts) once this file's absolute path is listed in
# ~/.config/infra-drift/cred-consumers.list. Schema, consumer kinds and the strict
# subset-TOML rules are documented in infraops-mcp-server/.cred-consumers.toml.
#
# Kept on infraops' manual checklist STRUCTURALLY by rotation_preconditions (each is a
# legacy-executor blocker), not merely by the unset consumers_verified. The PAT's
# repository-access list is a separate settings-page list that re-setting secrets never
# changes, so it is set when a person mints the new PAT. The SDS rotation executor
# (orchestrator ADR-0055 increment 7, adapter github-pat) writes every Actions copy below
# through its rotation App and verifies each by that repository's hourly
# secret-fingerprint.yml report; that replaced the throwaway push probe. See .bws-secrets.toml.
#
# History: the 2026-07-14 token was revoked; the current one was minted 2026-08-03 (BWS
# creationDate). orchestrator and infraops-mcp-server kept the dead copy until
# 2026-08-19. Values NEVER appear here.

version = 1
# Subset-parser note: array items are split on commas, so a string inside an array must
# contain no comma (a comma there is a parse error, which silences the whole registry).

# Census 2026-10-19 (gh secret list over every non-archived AlobarQuest repo): six
# repositories hold FACTORY_PR_TOKEN with a reader: orchestrator, intent-packages,
# infraops-mcp-server, security-standards, change-manager and brain. The copies in
# project-standards (not a factory target) and factory-runner (never run) had no reader
# and were dropped by Devon's decision of 2026-10-19. The portfolio scan fetches the
# keeper from BWS each run (project-standards #50).
[[credential]]
id = "factory-pr-token"
class = "github-pat-fine-grained"
provider = "github"
provider_identity = "AlobarQuest (fine-grained PAT; must keep Workflows read-and-write)"
bws_uuid = "a3240c2e-92d7-4b32-a726-b49b0135565a"
created = "2026-08-03"
disposition = "reissue"
rotation_preconditions = ["extend the new PAT repository-access list (settings page only; no API) to every factory target and to factory-runner before setting any copy"]

  [[credential.consumer]]
  kind = "bws-secret"
  uuid = "a3240c2e-92d7-4b32-a726-b49b0135565a"
  note = "FACTORY_PR_TOKEN (SDS Operator) — keeper"

  [[credential.consumer]]
  kind = "gh-actions-secret"
  repo = "AlobarQuest/orchestrator"
  name = "FACTORY_PR_TOKEN"

  [[credential.consumer]]
  kind = "gh-actions-secret"
  repo = "AlobarQuest/intent-packages"
  name = "FACTORY_PR_TOKEN"

  [[credential.consumer]]
  kind = "gh-actions-secret"
  repo = "AlobarQuest/infraops-mcp-server"
  name = "FACTORY_PR_TOKEN"

  [[credential.consumer]]
  kind = "gh-actions-secret"
  repo = "AlobarQuest/security-standards"
  name = "FACTORY_PR_TOKEN"

  [[credential.consumer]]
  kind = "gh-actions-secret"
  repo = "AlobarQuest/change-manager"
  name = "FACTORY_PR_TOKEN"

  [[credential.consumer]]
  kind = "gh-actions-secret"
  repo = "AlobarQuest/brain"
  name = "FACTORY_PR_TOKEN"

  [[credential.consumer]]
  kind = "runtime-fetch"
  repo = "project-standards"
  ref = "integrations/portfolio-scan.sh"
  healthchecks_check = "portfolio-scan"
  note = "launchd com.devon.portfolio-scan 03:00; Keychain Claude/BWS_ACCESS_TOKEN_SDS (sds-operator); Healthchecks check portfolio-scan"

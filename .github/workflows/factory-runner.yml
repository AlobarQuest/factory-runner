name: Factory Runner

'on':
  workflow_dispatch:
    inputs:
      work_unit_id:
        description: Approved orchestrator work-unit ID
        required: true
        type: string
      orchestrator_url:
        description: Orchestrator API URL
        required: false
        default: https://sds.alobar.net
        type: string
  workflow_call:
    inputs:
      work_unit_id:
        required: true
        type: string
      orchestrator_url:
        required: false
        default: https://sds.alobar.net
        type: string
    secrets:
      FACTORY_RUNNER_TOKEN:
        required: true
      FACTORY_RUNNER_CREDENTIAL_KEY_ID:
        required: true
      ANTHROPIC_API_KEY:
        required: true
      FACTORY_PR_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORCHESTRATOR_URL: ${{ inputs.orchestrator_url }}
      WORK_UNIT_ID: ${{ inputs.work_unit_id }}
      CURRENT_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          # PR-author identity so pushes/PRs trigger target-repo CI (not gated like GITHUB_TOKEN)
          token: ${{ secrets.FACTORY_PR_TOKEN }}

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      # Node 22, matching what the target repositories' OWN named checks run.
      #
      # The workflow pinned nothing here until 2026-09-04 and inherited whatever the
      # hosted image shipped, which is older. That is not a preference, it decides
      # whether an envelope can honestly verify its own work: unit a78881e2 finished a
      # zod 3->4 migration, passed the coding classifier, and died at `finalize-run`
      # because `npm test` could not BOOT --
      #     SyntaxError: 'node:util' does not provide an export named 'styleText'
      # `styleText` landed in Node 22, so vitest failed on the runner and passes in
      # every one of those repositories' own CI.
      #
      # This is also the honest half of the runner-honesty question. `intent-packages`
      # kept `npm test` on a deny-list because "a bare hosted runner cannot honestly run
      # it"; Devon ruled on 2026-09-03 that an envelope may name the target repository's
      # own gate when that gate IS the acceptance criterion. Both are satisfiable at once
      # by making the runner's environment match the gate rather than forbidding the gate.
      #
      # 22 because that is what five of six target repositories pin, measured, and what
      # infraops-mcp-server's named check uses -- and the NAMED CHECK is what AC-001 is
      # decided by, so matching it is the version that makes the envelope honest. That
      # repository also has a workflow on 24; matching the named check is the tie-break.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # `job.workflow_*` describes the workflow file defining THIS job — in a reusable
      # workflow that is factory-runner, not the caller (`github.*` is the caller). So the
      # workflow installs its own commit: the caller's pin, this workflow and the installed
      # CLI are one revision by construction, and the ordering rule that used to live only
      # in prose cannot be violated. `workflow_sha`, never `workflow_ref` — the ref is what
      # the caller pinned, unresolved, so a branch ref appears verbatim and is mutable.
      - name: Install pinned factory runner
        run: uv tool install "git+https://github.com/${{ job.workflow_repository }}.git@${{ job.workflow_sha }}"

      # Not tautological: verify-install-revision reads the INSTALLED distribution's
      # direct_url.json, written by uv from what it actually resolved. Independent source.
      - name: Verify factory runner revision
        run: factory-runner verify-install-revision --expected "${{ job.workflow_sha }}"

      - name: Prepare scoped run
        id: prepare
        env:
          FACTORY_RUNNER_TOKEN: ${{ secrets.FACTORY_RUNNER_TOKEN }}
          FACTORY_RUNNER_CREDENTIAL_KEY_ID: ${{ secrets.FACTORY_RUNNER_CREDENTIAL_KEY_ID }}
        run: |
          factory-runner prepare-run \
            --orchestrator-url "$ORCHESTRATOR_URL" \
            --credential-key-id "$FACTORY_RUNNER_CREDENTIAL_KEY_ID" \
            --work-unit-id "$WORK_UNIT_ID" \
            --current-repository "$CURRENT_REPOSITORY" \
            --workspace-dir "$RUNNER_TEMP/factory-runner"

      # `model` must be the action INPUT, not a step-level ANTHROPIC_MODEL env var.
      # This is a composite action whose inner step sets
      # `ANTHROPIC_MODEL: ${{ inputs.model || inputs.anthropic_model }}` — an inner
      # step's env overrides the caller's, so a step-level ANTHROPIC_MODEL is clobbered
      # with the empty input and the CLI silently falls back to its own default, the
      # retired `claude-sonnet-4-20250514`.
      - name: Run scoped coding action
        id: coding
        uses: anthropics/claude-code-base-action@e8132bc5e637a42c27763fc757faa37e1ee43b34
        with:
          model: claude-sonnet-5
          prompt_file: ${{ steps.prepare.outputs.prompt_file }}
          allowed_tools: ${{ steps.prepare.outputs.allowed_tools }}
          settings: ${{ steps.prepare.outputs.settings_file }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The approved authority envelope carries budgets.max_llm_calls, which the
          # runner does not yet read. Until it does, this literal is the effective
          # budget. 10 exhausted itself on exploration and committed nothing.
          #
          # 40 -> 60 on 2026-09-03, measured rather than guessed. Four full-length
          # attempts at a real zod 3->4 migration into infraops-mcp-server all ended
          # error_max_turns at exactly 40. The first three were mostly waste and were
          # fixed at the source (a refusal that explained nothing, a prompt that read
          # as an instruction to re-run the verifier); by the fourth the waste was
          # gone and the ceiling closed on the agent MID-EDIT on the right file, two
          # turns from testable. What changed underneath is that the envelope now
          # names the target repository's own gate, so an attempt must satisfy
          # eslint, prettier and the test suite rather than the build alone -- same
          # ceiling, more work.
          #
          # RAISING THIS IS COUPLED TO budgets.max_llm_calls, which is
          # max_attempts x THIS x calls-per-turn (~1.65 measured, rounded to 2). At
          # 60 that is 3 x 60 x 2 = 360, and intent-packages moves with it. Raising
          # one alone reproduces the failure that killed a unit permanently: the
          # UNRECOVERABLE budget gate binding before the recoverable attempt gate.
          max_turns: "60"

      - name: Classify coding result
        id: classify
        if: steps.coding.outcome == 'success'
        run: |
          factory-runner classify-coding-result \
            --execution-file "${{ steps.coding.outputs.execution_file }}"

      # Only meaningful once prepare has claimed the unit. Without this guard an
      # earlier failure runs finalize against an unclaimed unit, burying the real
      # error under a second one.
      - name: Finalize scoped run
        id: finalize
        if: steps.coding.outcome == 'success' && steps.classify.outcome == 'success'
        env:
          FACTORY_RUNNER_TOKEN: ${{ secrets.FACTORY_RUNNER_TOKEN }}
          FACTORY_RUNNER_CREDENTIAL_KEY_ID: ${{ secrets.FACTORY_RUNNER_CREDENTIAL_KEY_ID }}
          GITHUB_TOKEN: ${{ secrets.FACTORY_PR_TOKEN }}
        run: |
          factory-runner finalize-run \
            --orchestrator-url "$ORCHESTRATOR_URL" \
            --credential-key-id "$FACTORY_RUNNER_CREDENTIAL_KEY_ID" \
            --work-unit-id "$WORK_UNIT_ID" \
            --workspace-dir "$RUNNER_TEMP/factory-runner" \
            --execution-file "${{ steps.coding.outputs.execution_file }}"

      - name: Report failed scoped run
        id: report_failure
        if: >-
          always() &&
          steps.prepare.outcome == 'success' &&
          (steps.coding.outcome == 'failure' || steps.classify.outcome == 'failure' || steps.finalize.outcome == 'failure')
        env:
          FACTORY_RUNNER_TOKEN: ${{ secrets.FACTORY_RUNNER_TOKEN }}
          FACTORY_RUNNER_CREDENTIAL_KEY_ID: ${{ secrets.FACTORY_RUNNER_CREDENTIAL_KEY_ID }}
        run: |
          if [[ "${{ steps.finalize.outcome }}" == "failure" ]]; then
            reason="finalization_failed"
          else
            reason="coding_action_failed"
          fi
          factory-runner fail-run \
            --orchestrator-url "$ORCHESTRATOR_URL" \
            --credential-key-id "$FACTORY_RUNNER_CREDENTIAL_KEY_ID" \
            --work-unit-id "$WORK_UNIT_ID" \
            --workspace-dir "$RUNNER_TEMP/factory-runner" \
            --reason "$reason" \
            --execution-file "${{ steps.coding.outputs.execution_file }}"

name: Dependabot auto-merge

# The native lane (ADR-0016, orchestrator/docs/decisions/0016-…): routine dependency updates
# land without the factory, whose differentiated value is fixing the ones that FAIL.
#
# ONE FILE, SIX REPOSITORIES, BYTE-IDENTICAL — a property to preserve rather than a coincidence.
# `orchestrator/src/landing_ledger/rules.py` transcribes each revision of this gate BY HAND,
# keyed by its GIT BLOB SHA, and fails closed on a sha it does not know. Six copies that drift
# are six transcriptions; one copy is one. Until 2026-08-28 the estate ran three revisions of
# this file at once — differing in one clause and in a pinned action version — and each needed
# its own entry.
#
# EDITING THIS FILE IS THEREFORE A PAIRED OPERATION, in two directions. A byte changed here with
# no matching entry in `rules.py` stops the audit classifying any update in this repository, and
# says so only in production; a byte changed in ONE of the six reintroduces the divergence.
# `orchestrator/tests/landing_ledger/test_rules.py` asserts that the orchestrator's own copy is
# transcribed, which makes half of the pairing mechanical. The other half — that all six carry
# the same bytes — is checked by nothing, which is why this paragraph is here.
#
# WHAT THIS GATE ASKS, since 2026-08-28 (ADR-0034): one question, and it is not about the
# version number. A Dependabot pull request whose required checks pass is routine, whatever
# update type it declares or fails to declare — so the condition below names no update type at
# all. What decides is the OUTCOME, and this workflow never evaluates it: `--auto` hands that to
# GitHub, which lands the pull request only once the required checks pass. The factory takes
# what fails.
#
#   Until that date the condition was a cascade over update types — patch and minor in any
#   ecosystem, a major only in `github_actions`. It refused ten of the estate's thirteen open
#   updates on that day, and every one of those ten was a REQUIREMENT RANGE (`>=83.0.0`), which
#   Dependabot's own trailer states no version delta for. They were reachable by NEITHER lane —
#   not this one, and not the producer that feeds the factory, which drops a title stating no
#   single delta a guard earlier still — so they simply accumulated.
#
#   BE PRECISE ABOUT WHY, because the obvious sentence is false at the pin below, and a first
#   draft of this file asserted it. "No rule about update types could ever admit a range" was
#   measured against `fetch-metadata` v2. **v3.1.0 DERIVES an update type where the trailer
#   states none**: it added a regex over `update <name> requirement from A to B` and hands the
#   scraped pair to `calculateUpdateType`. So under v3.1.0 a type-keyed cascade admits
#   `>=0.52.0 → >=0.52.1` as a patch and refuses `>=83.0.0 → >=84.0.0` as a major — arithmetic
#   over two strings lifted out of a title, which no version number promised and nobody here
#   decided. Measured rather than read off the source: one of the two repositories already on
#   v3.1.0 carries exactly that second case as its open `setuptools` range, and it is correctly
#   unarmed today — under v2 it would have been unarmed for want of any declared type at all,
#   which is the same answer reached by a different route.
#
#   The condition below reads no update type at all, so it is indifferent to which version of
#   the action is pinned. What survives of the argument above is the part that never depended on
#   the version: both mechanisms already gate on the checks passing, and the type condition sat
#   on top of that gate saying nothing about whether the bump works.
#
#   The residual, stated so that it is decided rather than inherited: `semver-major` means the
#   author DECLARES a breaking change, while green checks mean THIS repository's tests do not
#   detect one. Those differ exactly where the tests are incomplete — which was equally true of
#   the patch and minor updates this estate has landed unattended for weeks, at a smaller blast
#   radius. The exposure is test coverage; what changed is how much of it is reached.
#
# THE ONE EXCLUSION IS PRINCIPLED RATHER THAN ENUMERATED: exclude where the required checks do
# not exercise what changed. Today that is exactly one ecosystem, `docker`, and it is ADR-0023's
# reasoning stated as a rule instead of as an instance. Both of the old cascade's grounds fail
# on a base image. The first — that patch and minor are backward-compatible by contract — holds
# only where the version number is a compatibility promise, and DOCKER TAGS ARE NOT SEMVER:
# `python:3.14` is a language version that happens to occupy the minor digit, and 3.12 → 3.14
# removes standard-library modules. The second — that the checks exercise it — fails because
# nothing RUNS the image: `quality.yml` does build the real Dockerfile on every pull request, so
# a dependency with no wheel for the new interpreter would fail `uv sync --frozen`, but no
# container is started and the suite executes on `setup-python` 3.12. A package that installs
# cleanly and fails at import on a removed module passes every check we have. Running the image
# is what would earn the permission back.
#
#   The clause is INERT in five of the six: only the orchestrator declares a `docker` ecosystem
#   in its `dependabot.yml` today. It is carried in all six anyway, so that the six stay one
#   blob, and so that a repository which later pins a service image is covered on the day it
#   does rather than on the day somebody remembers.
#
# Properties this file deliberately has:
#   * It ARMS GitHub's auto-merge rather than landing anything itself — and since 2026-08-28
#     that is the WHOLE of the rule rather than half of it. The condition no longer asks what
#     kind of change this is, so the required checks are the only thing left deciding, which
#     makes BRANCH PROTECTION load-bearing rather than a nicety: auto-merge on a branch with no
#     required status check acts immediately, on anything. All six require at least one check
#     that runs on `pull_request`, read back from the protection API on 2026-08-28. A repository
#     joining this lane must do the same BEFORE installing this file, not after.
#   * EDITING THIS FILE ARMS NOTHING THAT IS ALREADY OPEN. `on: pull_request_target` fires on
#     opened, synchronize and reopened — the same three activity types its predecessor
#     `pull_request` did — so a pull request that exists when this lands gets no event and
#     no evaluation, however plainly the new rule permits it. The standing backlog is exactly
#     what this change is FOR, so that is the normal case rather than an edge one — and the
#     landing ledger's Detector B reports a permitted, green, unarmed update as a FINDING with
#     no settle window. Give the queue a synchronize event (`PUT /pulls/{n}/update-branch`) in
#     the same operation that installs this rule, or the nightly audit stays red until the
#     update bot next rebases each branch of its own accord — a week, on a weekly schedule.
#   * THE TRIGGER IS `pull_request_target` AND NOTHING HERE READS THE BRANCH'S CONTENT. That
#     restraint is the whole reason the trigger is defensible: the standing objection to
#     `pull_request_target` is that it runs with the base repository's secrets against a branch
#     somebody else wrote. This file has no `actions/checkout`, executes nothing from the
#     branch, and asks the API for metadata through an action pinned by sha. ADDING A CHECKOUT
#     STEP HERE, OR ANY STEP THAT READS THE BRANCH, IS THE ONE EDIT THIS FILE MUST NEVER
#     RECEIVE. Reading the gate itself from the BASE branch is separately stronger for a gate
#     than reading it from the branch under judgement.
#   * THE ARM USES `FACTORY_PR_TOKEN`, NOT `secrets.GITHUB_TOKEN`, AND THAT IS WHAT THE TRIGGER
#     ABOVE IS FOR. An auto-merge armed with `secrets.GITHUB_TOKEN` fires no `on: push`
#     workflow — GitHub's recursion guard — so every landing this lane produced reached `main`
#     with the repository's own gate never having run on the result. Measured across three
#     repositories on 2026-08-11, and again across the six landings of 2026-08-28, none of
#     which carries a push run. ADR-0034 reopened the question on a changed fact — a wider rule
#     drains the queue faster, so the gap between landing and verification matters more than it
#     did — and left it open; ADR-0035 settled it. The credential was unreachable until then:
#     for an event TRIGGERED by the update bot, `on: pull_request` resolves `secrets.*` from the
#     DEPENDABOT store, where all six repositories hold nothing, while `pull_request_target`
#     resolves the ACTIONS store, where five of the six already held this token and the sixth
#     was given it in the same operation as this edit. Measured on a human-triggered and a
#     bot-triggered run alike, against a control naming a secret present in neither store. Note
#     `secrets.GITHUB_TOKEN` still serves the metadata step below: it is synthesized per run
#     rather than read from either store, so the trigger does not move it.
#   * THE PINNED ACTION MOVED for four of the six, and that is a second variable in one change,
#     stated rather than buried. `e849b3a8` and `72391c0f` ran v2; `a4a4b8da` already ran v3.1.0,
#     and one blob means one pin. Forward rather than back, because the update bot would
#     re-propose v3.1.0 within the week — which is also the standing hazard worth naming: a
#     `fetch-metadata` bump here is a `github_actions` update this rule permits, so it can land
#     unattended, change this file's blob, and leave `rules.py` not knowing the revision. The
#     audit then fails closed until somebody transcribes it, and the landing that did it carries
#     the caveat `rule_pinned_after_this_landing_changed_it`. It is not new — the cascade
#     permitted Actions majors too — but it is a reason to read this file's blob after any week
#     in which the bot has been busy.
#   * The literal below is the value `fetch-metadata` REPORTS, not the one `dependabot.yml`
#     spells. `update_metadata.ts` sets `packageEcosystem: chunks[1]` — the second segment of
#     the BRANCH NAME (`dependabot/github_actions/…`), the update bot's normalized identifier —
#     while the action's own documentation wrongly describes that output as the configured
#     value. The two disagree for `github_actions`, which the config spells with a HYPHEN, and
#     that mismatch is how the first attempt at this lane shipped and cleared nothing. They
#     agree for `docker`, checked against the real branch names rather than assumed. Check any
#     second exclusion the same way, and note the direction of failure has REVERSED: a wrong
#     literal used to leave a permission unclaimed, and now leaves an exclusion unenforced.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Dependabot auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read the update's metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Arm auto-merge, unless the required checks do not exercise what changed
        if: steps.meta.outputs.package-ecosystem != 'docker'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.FACTORY_PR_TOKEN }}

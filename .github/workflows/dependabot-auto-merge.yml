name: Dependabot auto-merge

# The native lane (ADR-0016, orchestrator/docs/decisions/0016-…): routine dependency updates
# land without the factory, whose differentiated value is fixing the ones that FAIL.
#
# Two properties this file deliberately has:
#   * It ENABLES GitHub's auto-merge rather than merging. GitHub then enforces "merge only when
#     the required checks pass" — this workflow never inspects CI and so cannot get that wrong.
#     Note auto-merge with NO required status check merges immediately; the branch protection
#     applied 2026-08-06 is therefore a precondition, not a nicety.
#   * Patch and minor for every ecosystem — plus MAJOR bumps of GitHub Actions, which are a
#     different risk wearing the same version-number shape. A package major changes what ships
#     and can pass every check then break at runtime; an Actions major changes how CI runs, and
#     the required check that gates it IS the thing being bumped, so passing it means the new
#     version has been exercised exactly as it will be used. Verified 2026-08-07 rather than
#     assumed: every Actions dependency in this repo is used by a job that runs on
#     `pull_request`. The one estate case where that is false — `docker/setup-buildx-action`,
#     used only by orchestrator's `workflow_dispatch` release build — is in a repo with no
#     auto-merge workflow, so it is out of scope here.
#   * Package majors still fall through to a human, deliberately.
#   * The literal below is `github_actions` with an UNDERSCORE, and that is not a typo.
#     fetch-metadata's own action.yml documents this output as "the `package-ecosystem`
#     configuration that was used by dependabot", which is wrong about its own output:
#     `update_metadata.ts` sets `packageEcosystem: chunks[1]`, i.e. the second segment of
#     the BRANCH NAME (`dependabot/github_actions/...`), which is Dependabot's normalized
#     identifier. dependabot.yml spells it `github-actions` with a hyphen; the output does
#     not. Measured from a real run rather than read from the docs — the action logs
#     `outputs.package-ecosystem: github_actions`. A mismatch fails closed: nothing arms,
#     silently, which is how the first attempt at this shipped and cleared nothing.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Dependabot auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read the update's metadata
        id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch, minor, and GitHub Actions major updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

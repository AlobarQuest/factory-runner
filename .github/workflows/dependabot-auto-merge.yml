name: Dependabot auto-merge

# The native lane (ADR-0016, orchestrator/docs/decisions/0016-…): routine dependency updates
# land without the factory, whose differentiated value is fixing the ones that FAIL.
#
# Two properties this file deliberately has:
#   * It ENABLES GitHub's auto-merge rather than merging. GitHub then enforces "merge only when
#     the required checks pass" — this workflow never inspects CI and so cannot get that wrong.
#     Note auto-merge with NO required status check merges immediately; the branch protection
#     applied 2026-08-06 is therefore a precondition, not a nicety.
#   * It is a CASCADE, and the condition below is written to read as one. Q1: is the declared
#     intent sufficient on its own? Patch and minor are, in every ecosystem. Q2, asked only
#     when Q1 says no: the intent is `major`, which we do not accept on its own — is there
#     another reason this one is safe? For GitHub Actions there is, and it is not the category
#     itself: the required check that gates the pull request IS the thing being bumped, so
#     passing it means the new version has been exercised exactly as it will be used. A package
#     major has no such property — it changes what ships and can pass every check then break at
#     runtime — so it still falls through to a human.
#
#     Until 2026-08-08 these were three peers ORed together, which misrepresented the logic:
#     the first two answer "what kind of change is this?" and the third answered "what kind of
#     thing is being changed?". Two answers to different questions cannot constrain each other,
#     so the third admitted its ENTIRE category rather than the majors its name claimed, and it
#     subsumed the first two inside that category. Restating it as the cascade changes no
#     decision the gate has ever made; it closes one combination — an absent update-type in
#     github_actions — that never occurred in 26 pull requests and that the fail-closed model
#     does not want open. See STANDARDS.md, "One question per predicate".
#
#     Verified 2026-08-07 rather than assumed: every Actions dependency in this repo is used by
#     a job that runs on `pull_request`. The one estate case where that is false —
#     `docker/setup-buildx-action`, used only by orchestrator's `workflow_dispatch` release
#     build — is in a repo with no auto-merge workflow, so it is out of scope here.
#   * An update with NO declared intent is refused, and now says so rather than merely failing
#     to match. Dependabot omits `update-type` for requirement-range bumps and for tags it
#     cannot parse as semver, so the absence covers several unlike situations and asserts
#     nothing about any of them.
#   * The literal below is `github_actions` with an UNDERSCORE, and that is not a typo.
#     fetch-metadata's own action.yml documents this output as "the `package-ecosystem`
#     configuration that was used by dependabot", which is wrong about its own output:
#     `update_metadata.ts` sets `packageEcosystem: chunks[1]`, i.e. the second segment of
#     the BRANCH NAME (`dependabot/github_actions/...`), which is Dependabot's normalized
#     identifier. dependabot.yml spells it `github-actions` with a hyphen; the output does
#     not. Measured from a real run rather than read from the docs — the action logs
#     `outputs.package-ecosystem: github_actions`. A mismatch fails closed: nothing arms,
#     silently, which is how the first attempt at this shipped and cleared nothing.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Dependabot auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read the update's metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge when the intent suffices, or a major is exercised by the gate
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          (steps.meta.outputs.update-type == 'version-update:semver-major' &&
           steps.meta.outputs.package-ecosystem == 'github_actions')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

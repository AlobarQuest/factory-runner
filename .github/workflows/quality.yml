name: Quality

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # A daily run of this same gate against the default branch, added 2026-08-15.
  # The Dependabot cascade arms with the token the CI platform supplies, and a landing
  # made with that token fires no `push` event -- so a bump can reach `main` with this
  # gate never having run on the result. Asking the question on a clock closes that
  # hole without changing which identity lands the pull request.
  #
  # It does NOT attribute a failure to the commit that caused it: a red scheduled run
  # means bisecting the day's landings. That is the accepted cost of leaving the
  # arming identity alone; the tightening that would remove it is a separate decision.
  #
  # The minute is off the hour on purpose -- runs queued at :00 are delayed -- and is
  # staggered against the other five lane repositories. Times are UTC: 11:03 is after
  # the 02:00-06:00 window in which this estate lands changes unattended, so an
  # overnight landing is checked the same morning.
  schedule:
    - cron: "3 11 * * *"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.31"

      - name: Install locked dependencies
        run: uv sync --frozen

      # `make check` resolves every tool from .venv/bin and fails if one is
      # missing, so a runner that skipped `uv sync` cannot report success.
      - name: Run full quality gate
        run: make check
